<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
</head>
<body>
<title>Bubble Diagram · Bangpu Cozy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: a jelly bubble stage (front of the plot at the bottom) beside a small side panel; stacks on phones.
   Single light look on purpose: the brief asks for a white ground. */
:root{
  color-scheme:light;
  --bg:#ffffff;
  --ink:#2d2940;
  --muted:#7d7891;
  --line:#ece8f4;
  --soft:#f7f5fb;
  --road:#f1eff6;
  --font:'IBM Plex Sans Thai','Sarabun',system-ui,sans-serif;
  --cute:'Mali','Itim','Sarabun',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 28px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr);gap:14px}}
.side{display:grid;gap:18px;min-width:0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
@media (max-width:820px){.side{position:static}}
.eyebrow{font-size:13px;letter-spacing:.06em;color:var(--muted);margin:0}
h1{font-family:var(--cute);font-size:clamp(30px,4.4vw,42px);line-height:1.1;margin:2px 0 6px;font-weight:700;text-wrap:balance}
.lede{margin:0;color:var(--muted);font-size:14.5px;line-height:1.6}
.floors{display:inline-flex;gap:6px;padding:5px;background:var(--soft);border-radius:999px;width:max-content}
.floors button{font:600 15px var(--font);color:var(--muted);background:none;border:0;border-radius:999px;padding:7px 18px;cursor:pointer;transition:transform .25s cubic-bezier(.3,1.8,.5,1)}
.floors button:hover{transform:scale(1.06)}
.floors button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.floors button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.card{background:var(--soft);border-radius:18px;padding:14px 16px;min-height:86px;display:grid;gap:4px;align-content:start}
.card b{font-family:var(--cute);font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.card span{color:var(--muted);font-size:14px;line-height:1.55}
.dot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:inset -2px -3px 4px rgba(0,0,0,.12),inset 2px 2px 3px rgba(255,255,255,.8)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:14px;margin:0;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:7px}
.note{font-size:12.5px;color:var(--muted);line-height:1.6;margin:0}
.stage{position:relative;min-width:0}
canvas{display:block;width:100%;touch-action:pan-y;cursor:default}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

<div class="wrap">
  <aside class="side">
    <div>
      <p class="eyebrow">BUBBLE DIAGRAM</p>
      <h1>บ้าน + ร้าน Bangpu Cozy</h1>
      <p class="lede">พื้นที่แต่ละส่วนอยู่ใกล้กันแค่ไหน และเชื่อมกันอย่างไร ลองเอาเมาส์ไปแตะเจลลี่ดูได้เลย</p>
    </div>
    <div class="floors" role="group" aria-label="เลือกชั้น">
      <button type="button" id="f1" aria-pressed="true">ชั้น 1</button>
      <button type="button" id="f2" aria-pressed="false">ชั้น 2</button>
    </div>
    <div class="card" id="card" aria-live="polite"></div>
    <ul class="legend" id="legend"></ul>
    <p class="note">ขนาดเจลลี่บอกขนาดพื้นที่โดยประมาณ ไม่ใช่สเกลจริง · เส้นประคือส่วนที่เดินถึงกัน · ด้านล่างคือหน้าที่ดินติดซอย</p>
  </aside>
  <div class="stage">
    <canvas id="cv" role="img" aria-label="แผนภาพฟองเจลลี่แสดงพื้นที่ใช้สอยของบ้านและร้าน"></canvas>
    <ul class="sr" id="srList"></ul>
  </div>
</div>

<script>
(() => {
const G = {
  shop:  {t:'ค้าขาย',            a:'#FFD95A', b:'#FFA92E', ink:'#6e4300'},
  cook:  {t:'ครัว / เตา',         a:'#FF9A6E', b:'#FF5F7A', ink:'#86202d'},
  pray:  {t:'บูชา',              a:'#FFA3DA', b:'#C985FF', ink:'#6a1f78'},
  home:  {t:'ที่อยู่อาศัย',        a:'#86E6B4', b:'#38C3B0', ink:'#0c5a4b'},
  water: {t:'ห้องน้ำ / ซักล้าง',   a:'#86DCFF', b:'#5096FF', ink:'#0f3f84'},
  store: {t:'จอดรถ / โกดัง (อาคารเดิม)', a:'#C6CCE2', b:'#8B97BD', ink:'#2b3553'}
};
const BED = 'ห้องนอนพร้อมห้องน้ำในตัว';
// x, y in a 100 × 124 stage; front of the plot (the soi) is at the bottom
const ROOMS = [
  {id:1,  f:1, n:'หน้าร้าน\nขายของ',   g:'shop',  x:32, y:106, r:9.5, d:'ร้านข้าวสาร ยกพื้นหนีน้ำ ขึ้น 3–4 ขั้น'},
  {id:2,  f:1, n:'เตา + ถ่าน',         g:'cook',  x:52, y:108, r:6,   d:'โซนเตาแยก อยู่ด้านหน้าร้าน'},
  {id:3,  f:1, n:'Office',             g:'shop',  x:56, y:91,  r:7.5, d:'ติดประตูขนของ เดินเข้าที่จอดรถได้'},
  {id:4,  f:1, n:'ตี่จู้\nปึงเถ้า',       g:'pray',  x:28, y:90,  r:5.5, d:'ท้ายร้าน หันออกหน้าร้าน'},
  {id:5,  f:1, n:'ครัว',               g:'cook',  x:12, y:93,  r:6.5, d:'ครัวร้าน อยู่มุมหลังร้าน'},
  {id:6,  f:1, n:'ที่จอดรถ\n+ Loading', g:'store', x:82, y:96,  r:12,  d:'ใช้อาคารเดิม รถขึ้นทางลาดจากหน้าที่ดิน'},
  {id:7,  f:1, n:'โกดังข้าว',           g:'store', x:82, y:50,  r:15,  d:'ใช้อาคารเดิมส่วนหลัง'},
  {id:8,  f:1, n:'ที่ตากผ้า',           g:'water', x:30, y:73,  r:10,  d:'ลานกลาง หลังคาโปร่งแสง'},
  {id:9,  f:1, n:'ซักล้าง',            g:'water', x:50, y:72,  r:7,   d:'หลังคาโปร่งแสง อยู่ติดที่ตากผ้า'},
  {id:10, f:1, n:'โถงบ้าน\nห้องรับแขก', g:'home',  x:44, y:36,  r:12,  d:'มีมุมกินข้าว อยู่ใกล้ Pantry'},
  {id:11, f:1, n:'ห้องนอน\n+ ห้องน้ำ',  g:'home',  x:30, y:12,  r:8,   d:BED},
  {id:12, f:1, n:'ห้องนอน\n+ ห้องน้ำ',  g:'home',  x:47, y:11,  r:8,   d:BED},
  {id:13, f:1, n:'ห้องนอน\n+ ห้องน้ำ',  g:'home',  x:64, y:12,  r:8,   d:BED},
  {id:14, f:1, n:'Pantry',             g:'cook',  x:34, y:55,  r:6,   d:'ครัวเบาในบ้าน'},
  {id:15, f:1, n:'ห้องน้ำ',            g:'water', x:55, y:53,  r:4.5, d:'ห้องน้ำรวมชั้นล่าง'},
  {id:16, f:1, n:'ที่จอดรถ',           g:'store', x:11, y:16,  r:9,   d:'ลานจอดหลังบ้าน 2 คัน'},
  {id:17, f:2, n:'ห้องพระ',            g:'pray',  x:42, y:62,  r:8,   d:'ด้านหน้าชั้น 2 หันพระออกด้านถนน'},
  {id:18, f:2, n:'Gym +\nLibrary',     g:'home',  x:46, y:36,  r:13,  d:'ห้องออกกำลังกายและมุมอ่านหนังสือ'},
  {id:19, f:2, n:'ห้องนอน',            g:'home',  x:32, y:13,  r:9,   d:'ใช้ห้องน้ำร่วมกับห้องนอนอีกห้อง'},
  {id:21, f:2, n:'ห้องน้ำ',            g:'water', x:49, y:11,  r:5,   d:'เข้าได้จากห้องนอนทั้งสองห้อง'},
  {id:20, f:2, n:'ห้องนอน',            g:'home',  x:66, y:13,  r:9,   d:'ใช้ห้องน้ำร่วมกับห้องนอนอีกห้อง'},
  {id:22, f:2, n:'Storage',            g:'store', x:84, y:60,  r:14,  d:'ชั้น 2 ของอาคารเดิม'}
];
const LINKS = [[1,2],[2,3],[1,4],[4,5],[3,6],[6,7],[8,9],[8,14],[14,10],[10,15],[10,11],[10,12],[10,13],
               [18,17],[18,19],[18,20],[19,21],[20,21]];
const EXIST = {1:[6,7], 2:[22]};
const SW = 100, SH = 124, N = 44;

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const card = document.getElementById('card');
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
let floor = 1, W = 0, H = 0, S = 1, OX = 0, OY = 0, dpr = 1;
let hover = null, pin = null, ptr = null, awake = true, last = 0;

for (const r of ROOMS){ r.d0 = new Float32Array(N); r.v = new Float32Array(N); r.s = 0; r.sv = 0; r.hv = 0; r.hvv = 0; r.t0 = 0; }
const byId = Object.fromEntries(ROOMS.map(r => [r.id, r]));
const onFloor = () => ROOMS.filter(r => r.f === floor);

/* ---------- side panel ---------- */
document.getElementById('legend').innerHTML = Object.values(G).map(g =>
  `<li><i class="dot" style="background:radial-gradient(circle at 35% 30%,#fff 0 18%,${g.a} 45%,${g.b})"></i>${g.t}</li>`).join('');
function showCard(r){
  if (!r){
    card.innerHTML = `<b>ชั้น ${floor}</b><span>ชี้หรือแตะเจลลี่เพื่อดูว่าแต่ละห้องคืออะไร</span>`;
    return;
  }
  const g = G[r.g];
  card.innerHTML = `<b><i class="dot" style="background:radial-gradient(circle at 35% 30%,#fff 0 18%,${g.a} 45%,${g.b})"></i>${r.n.replace('\n',' ')}</b><span>${r.d}</span>`;
}
function srList(){
  document.getElementById('srList').innerHTML = onFloor().map(r => `<li>${r.n.replace('\n',' ')}: ${r.d}</li>`).join('');
}
function setFloor(f){
  floor = f;
  document.getElementById('f1').setAttribute('aria-pressed', f === 1);
  document.getElementById('f2').setAttribute('aria-pressed', f === 2);
  hover = pin = null;
  const now = performance.now();
  onFloor().forEach((r, i) => { r.s = calm ? 1 : 0; r.sv = 0; r.t0 = now + (calm ? 0 : 40 + i*45); r.d0.fill(0); r.v.fill(0); });
  showCard(null); srList(); wake();
}
document.getElementById('f1').onclick = () => setFloor(1);
document.getElementById('f2').onclick = () => setFloor(2);

/* ---------- sizing ---------- */
function resize(){
  const w = cv.parentElement.clientWidth;
  const h = Math.min(w * SH / SW, Math.max(420, innerHeight * 0.9));
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = w; H = h;
  cv.style.height = h + 'px';
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  S = Math.min(W / SW, H / SH); OX = (W - SW*S) / 2; OY = (H - SH*S) / 2;
  wake();
}
addEventListener('resize', resize);
const X = v => OX + v*S, Y = v => OY + v*S;

/* ---------- jelly physics: each bubble is a ring of points that springs back to its circle ---------- */
function kick(r, ang, amt, uniform = 0){
  if (calm) amt *= 0.35;
  for (let i = 0; i < N; i++){
    const th = i / N * Math.PI * 2;
    r.v[i] += amt * Math.cos(2*(th - ang)) + uniform;
  }
  wake();
}
function step(r, dt){
  const d = r.d0, v = r.v;
  let mean = 0, energy = 0;
  for (let i = 0; i < N; i++){
    const lap = d[(i+N-1)%N] + d[(i+1)%N] - 2*d[i];
    v[i] += (-210*d[i] + 520*lap - 4.2*v[i]) * dt;
  }
  for (let i = 0; i < N; i++){ d[i] += v[i]*dt; mean += d[i]; }
  mean /= N;
  for (let i = 0; i < N; i++){ d[i] -= mean*0.12; d[i] = Math.max(-0.35, Math.min(0.35, d[i])); energy += Math.abs(d[i]) + Math.abs(v[i])*0.05; }
  // pop-in and hover swell use small springs too
  // pop-in is time based, so it always finishes even when frames are dropped
  const p = (performance.now() - r.t0) / 700;
  r.s = p <= 0 ? 0 : p >= 1 ? 1 : 1 + Math.pow(2, -9*p) * Math.sin((p*7 - 0.75) * 2.0944);
  const ht = (hover === r || pin === r) ? 1 : 0;
  r.hvv += (260*(ht - r.hv) - 14*r.hvv) * dt; r.hv += r.hvv*dt;
  return energy + (p < 1 ? 1 : 0) + Math.abs(ht - r.hv) + Math.abs(r.hvv)*0.1;
}
function pushFromPointer(r, dt){
  if (!ptr || !ptr.v) return;
  const cx = X(r.x), cy = Y(r.y), R = r.r*S;
  if (Math.hypot(ptr.x - cx, ptr.y - cy) > R*1.4) return;
  for (let i = 0; i < N; i++){
    const th = i / N * Math.PI * 2, ux = Math.cos(th), uy = Math.sin(th);
    const dd = Math.hypot(ptr.x - (cx + ux*R), ptr.y - (cy + uy*R)) / R;
    const w = Math.exp(-((dd/0.6)**2));
    r.v[i] += (ptr.vx*ux + ptr.vy*uy) / R * w * (calm ? 0.02 : 0.07);
  }
}

/* ---------- pointer ---------- */
function hit(x, y){
  let best = null;
  for (const r of onFloor()){ const dd = Math.hypot(x - X(r.x), y - Y(r.y)); if (dd < r.r*S*(1 + 0.06*r.hv) && (!best || dd < best.dd)) best = {r, dd}; }
  return best && best.r;
}
function local(ev){ const b = cv.getBoundingClientRect(); return [ev.clientX - b.left, ev.clientY - b.top]; }
cv.addEventListener('pointermove', ev => {
  const [x, y] = local(ev), t = performance.now();
  if (ptr){ const k = Math.max(8, t - ptr.t); ptr.vx = (x - ptr.x)/k*1000; ptr.vy = (y - ptr.y)/k*1000; ptr.v = true; }
  ptr = {...(ptr||{}), x, y, t};
  const h = hit(x, y);
  if (h !== hover){
    if (h){ kick(h, Math.atan2(y - Y(h.y), x - X(h.x)), 1.6); if (!pin) showCard(h); }
    else if (!pin) showCard(null);
    hover = h;
  }
  cv.style.cursor = h ? 'pointer' : 'default';
  wake();
});
cv.addEventListener('pointerleave', () => { ptr = null; hover = null; if (!pin) showCard(null); cv.style.cursor = 'default'; wake(); });
cv.addEventListener('pointerdown', ev => {
  const [x, y] = local(ev), h = hit(x, y);
  if (h){ kick(h, Math.atan2(y - Y(h.y), x - X(h.x)) + Math.PI/2, 2.6, -1.2); pin = h; showCard(h); }
  else { pin = null; showCard(hover); }
  wake();
});

/* ---------- drawing ---------- */
function hexA(hex, a){ const n = parseInt(hex.slice(1), 16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; }
function ringPts(r){
  const cx = X(r.x), cy = Y(r.y), R = r.r*S*Math.max(0, r.s)*(1 + 0.06*r.hv), pts = [];
  for (let i = 0; i < N; i++){ const th = i/N*Math.PI*2, k = R*(1 + r.d0[i]); pts.push([cx + Math.cos(th)*k, cy + Math.sin(th)*k]); }
  return {cx, cy, R, pts};
}
function tracePath(pts){
  ctx.beginPath();
  const m = (a, b) => [(a[0]+b[0])/2, (a[1]+b[1])/2];
  let p = m(pts[N-1], pts[0]); ctx.moveTo(p[0], p[1]);
  for (let i = 0; i < N; i++){ const q = m(pts[i], pts[(i+1)%N]); ctx.quadraticCurveTo(pts[i][0], pts[i][1], q[0], q[1]); }
  ctx.closePath();
}
const dAt = (r, ang) => r.d0[((Math.round(ang / (Math.PI*2) * N) % N) + N) % N];

function drawJelly(r){
  const g = G[r.g], {cx, cy, R, pts} = ringPts(r);
  if (R < 1) return;
  tracePath(pts);
  // body with a soft coloured shadow
  ctx.save();
  ctx.shadowColor = hexA(g.b, 0.34); ctx.shadowBlur = R*0.55; ctx.shadowOffsetY = R*0.2;
  const lin = ctx.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
  lin.addColorStop(0, hexA(g.a, 0.88)); lin.addColorStop(1, hexA(g.b, 0.92));
  ctx.fillStyle = lin; ctx.fill();
  ctx.restore();
  ctx.save(); ctx.clip();
  // light passing through the middle
  let rg = ctx.createRadialGradient(cx - R*0.15, cy - R*0.2, 0, cx - R*0.15, cy - R*0.2, R*1.05);
  rg.addColorStop(0, 'rgba(255,255,255,.62)'); rg.addColorStop(0.55, 'rgba(255,255,255,.12)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = rg; ctx.fillRect(cx - R*1.5, cy - R*1.5, R*3, R*3);
  // denser colour at the rim
  rg = ctx.createRadialGradient(cx, cy, R*0.62, cx, cy, R*1.08);
  rg.addColorStop(0, hexA(g.b, 0)); rg.addColorStop(1, hexA(g.b, 0.55));
  ctx.fillStyle = rg; ctx.fillRect(cx - R*1.5, cy - R*1.5, R*3, R*3);
  // caustic glow at the bottom
  const bk = 1 + dAt(r, Math.PI*0.35);
  rg = ctx.createRadialGradient(cx + R*0.22*bk, cy + R*0.62*bk, 0, cx + R*0.22*bk, cy + R*0.62*bk, R*0.5);
  rg.addColorStop(0, 'rgba(255,255,255,.55)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = rg; ctx.fillRect(cx - R*1.5, cy - R*1.5, R*3, R*3);
  // glassy inner rim
  ctx.lineWidth = Math.max(2, R*0.13); ctx.strokeStyle = 'rgba(255,255,255,.42)'; ctx.stroke();
  ctx.restore();
  // outline
  ctx.lineWidth = 1.2; ctx.strokeStyle = hexA(g.b, 0.6); ctx.stroke();
  // specular highlight follows the wobble
  const hk = 1 + dAt(r, Math.PI*1.25);
  ctx.save();
  ctx.translate(cx - R*0.4*hk, cy - R*0.42*hk); ctx.rotate(-0.7);
  ctx.scale(1, 0.48);
  rg = ctx.createRadialGradient(0, 0, 0, 0, 0, R*0.32);
  rg.addColorStop(0, 'rgba(255,255,255,.95)'); rg.addColorStop(0.6, 'rgba(255,255,255,.5)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(0, 0, R*0.32, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.beginPath(); ctx.arc(cx - R*0.08*hk, cy - R*0.66*hk, Math.max(1.2, R*0.045), 0, Math.PI*2); ctx.fill();
  // label squashes with the jelly
  const sx = 1 + (r.d0[0] + r.d0[N/2])/2, sy = 1 + (r.d0[N/4] + r.d0[3*N/4])/2;
  const lines = r.n.split('\n');
  let fs = Math.max(10.5, Math.min(22, R*0.34));
  ctx.font = `700 ${fs}px Mali, Itim, sans-serif`;
  const widest = Math.max(...lines.map(l => ctx.measureText(l).width));
  if (widest > R*1.6){ fs = Math.max(10, fs * R*1.6 / widest); ctx.font = `700 ${fs}px Mali, Itim, sans-serif`; }
  ctx.save();
  ctx.translate(cx, cy + R*0.04); ctx.scale(sx, sy);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  lines.forEach((l, i) => {
    const ty = (i - (lines.length - 1)/2) * fs * 1.18;
    ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.strokeText(l, 0, ty);
    ctx.fillStyle = g.ink; ctx.fillText(l, 0, ty);
  });
  ctx.restore();
}

function drawLinks(){
  ctx.save();
  ctx.setLineDash([2, 7]); ctx.lineCap = 'round'; ctx.lineWidth = 3; ctx.strokeStyle = '#d6d1e4';
  for (const [a, b] of LINKS){
    const A = byId[a], B = byId[b];
    if (A.f !== floor) continue;
    const k = Math.min(A.s, B.s); if (k < 0.3) continue;
    const ax = X(A.x), ay = Y(A.y), bx = X(B.x), by = Y(B.y), L = Math.hypot(bx-ax, by-ay);
    const ux = (bx-ax)/L, uy = (by-ay)/L, ra = A.r*S + 4, rb = B.r*S + 4;
    if (L <= ra + rb) continue;
    ctx.beginPath(); ctx.moveTo(ax + ux*ra, ay + uy*ra); ctx.lineTo(bx - ux*rb, by - uy*rb); ctx.stroke();
  }
  ctx.restore();
}
function roundRect(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r); ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath(); }
function label(t, x, y, size, color, align = 'center'){
  ctx.font = `500 ${size}px 'IBM Plex Sans Thai', Sarabun, sans-serif`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillStyle = color; ctx.fillText(t, x, y);
}
function arrow(x1, y1, x2, y2, color){
  ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  const a = Math.atan2(y2-y1, x2-x1), s = 7;
  ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - s*Math.cos(a-0.5), y2 - s*Math.sin(a-0.5)); ctx.lineTo(x2 - s*Math.cos(a+0.5), y2 - s*Math.sin(a+0.5)); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawGround(){
  const small = Math.max(10.5, Math.min(14, S*2.6));
  // kept building outline
  const ids = EXIST[floor].map(i => byId[i]);
  const x0 = Math.min(...ids.map(r => r.x - r.r)) - 2.5, x1 = Math.max(...ids.map(r => r.x + r.r)) + 2.5;
  const y0 = Math.min(...ids.map(r => r.y - r.r)) - 6, y1 = Math.max(...ids.map(r => r.y + r.r)) + 2.5;
  ctx.save();
  roundRect(X(x0), Y(y0), (x1-x0)*S, (y1-y0)*S, 7*S);
  ctx.fillStyle = '#f6f6fb'; ctx.fill();
  ctx.setLineDash([6, 6]); ctx.lineWidth = 1.5; ctx.strokeStyle = '#c9cde0'; ctx.stroke();
  ctx.restore();
  label('อาคารเดิม (คงไว้)', X((x0+x1)/2), Y(y0 + 3), small, '#8b93b2');
  // soi along the front
  ctx.fillStyle = '#f3f1f8'; roundRect(X(-2), Y(117.5), (SW+4)*S, 6*S, 3*S); ctx.fill();
  label('ซอย · หน้าที่ดิน', X(62), Y(120.5), small, '#a7a2bb');
  if (floor === 1){
    const ac = '#9b95b3';
    arrow(X(32), Y(121.5), X(32), Y(116.5), ac); label('ทางเข้าร้าน', X(32) + 6, Y(120.5), small, ac, 'left');
    arrow(X(80), Y(121.5), X(80), Y(109), ac); label('ทางเข้ารถ', X(80) + 6, Y(120.5), small, ac, 'left');
    ctx.save(); ctx.strokeStyle = ac; ctx.lineWidth = 2.2; ctx.setLineDash([5, 6]); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(X(3), Y(121.5)); ctx.lineTo(X(3), Y(36)); ctx.lineTo(X(29), Y(36)); ctx.stroke(); ctx.restore();
    arrow(X(26), Y(36), X(31), Y(36), ac);
    ctx.save(); ctx.translate(X(6.5), Y(66)); ctx.rotate(-Math.PI/2); label('ทางเข้าบ้าน', 0, 0, small, ac); ctx.restore();
  } else {
    // ghost of the ground floor's shop and court under the second floor
    ctx.save(); ctx.setLineDash([3, 6]); ctx.lineWidth = 1.4; ctx.strokeStyle = '#dcd8e8';
    for (const r of ROOMS) if (r.f === 1 && r.y > 64 && r.x < 66){ ctx.beginPath(); ctx.arc(X(r.x), Y(r.y), r.r*S, 0, Math.PI*2); ctx.stroke(); }
    ctx.restore();
    label('ใต้นี้คือร้านและลานกลางชั้น 1', X(32), Y(84), small, '#b7b2c9');
  }
}

function frame(t){
  const dt = Math.min(0.033, (t - (last || t)) / 1000) || 0.016; last = t;
  let energy = 0;
  for (const r of onFloor()){
    pushFromPointer(r, dt);
    const n = 2; for (let k = 0; k < n; k++) energy += step(r, dt/n);
  }
  if (ptr) { ptr.vx *= 0.6; ptr.vy *= 0.6; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
  drawGround(); drawLinks();
  const list = onFloor().slice().sort((a, b) => a.hv - b.hv);
  for (const r of list) drawJelly(r);
  const pending = onFloor().some(r => performance.now() < r.t0);
  if (energy > 0.02 || pending || (ptr && (Math.abs(ptr.vx) + Math.abs(ptr.vy)) > 1)) requestAnimationFrame(frame);
  else { awake = false; last = 0; }
}
function wake(){ if (!awake){ awake = true; requestAnimationFrame(frame); } }

resize(); setFloor(1);
awake = true; requestAnimationFrame(frame);
(document.fonts && document.fonts.load ? Promise.all([document.fonts.load('700 16px Mali'), document.fonts.load('500 14px "IBM Plex Sans Thai"')]) : Promise.resolve()).then(wake, wake);
})();
</script>
